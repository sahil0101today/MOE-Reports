<!DOCTYPE html>
<html>
<head>
  <title>Upload CSV or Excel File to Google Drive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }
    input[type="file"] {
      margin: 10px 0;
    }
    .message {
      margin-top: 15px;
      font-weight: bold;
    }
    #download-link {
      display: block;
      margin-top: 10px;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Upload CSV or Excel File to Google Drive</h2>
  <form id="uploadForm">
    <label>Select a file (Max 10MB, only .csv/.xls/.xlsx):</label><br/>
    <input type="file" id="fileInput" accept=".csv, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required><br/>
    <button type="submit">Upload</button>
  </form>

  <div class="message" id="message"></div>
  <a id="download-link" href="#" target="_blank" style="display: none;"></a>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const message = document.getElementById('message');
    const downloadLink = document.getElementById('download-link');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = fileInput.files[0];
      const allowedTypes = [
        "text/csv",
        "application/vnd.ms-excel", // .xls
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" // .xlsx
      ];

      if (!file) {
        message.textContent = "Please select a file.";
        return;
      }

      if (!allowedTypes.includes(file.type)) {
        message.textContent = "Only .csv, .xls, or .xlsx files are allowed.";
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        message.textContent = "File size exceeds 10MB.";
        return;
      }

      message.textContent = "Uploading...";

      const reader = new FileReader();
      reader.onload = async function(event) {
        const base64Data = event.target.result.split(',')[1];

        const formData = {
          fileName: file.name,
          mimeType: file.type,
          data: base64Data
        };

        try {
          const response = await fetch('https://script.google.com/macros/s/AKfycbyIyWzIZqmcW72EcUskxqANnjDoyjrh7nKWn42TrC2DlwnvM6rCAjyixqk_Qh7Y3dug5Q/exec', {
            method: 'POST',
            body: JSON.stringify(formData),
            headers: {
              'Content-Type': 'application/json'
            }
          });

          const result = await response.json();

          if (result.status === 'success') {
            message.textContent = "Upload successful!";
            downloadLink.href = result.fileUrl;
            downloadLink.textContent = "Click here to download the file";
            downloadLink.style.display = 'block';
          } else {
            message.textContent = "Error: " + result.message;
          }
        } catch (err) {
          message.textContent = "Upload failed. " + err.message;
        }
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
